apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gtw-prod
  namespace: infra-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: secret-tls
      allowedRoutes:
        namespaces:
          from: All
