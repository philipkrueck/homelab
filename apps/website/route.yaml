apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
  namespace: website
spec:
  parentRefs:
    - name: gtw-prod
      namespace: infra-gateway
      sectionName: http
    - name: gtw-prod
      namespace: infra-gateway
      sectionName: https
  hostnames:
    - philipkrueck.com
    - www.philipkrueck.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: website
          namespace: website
          port: 3000
