apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: website
          image: ghcr.io/philipkrueck/website:v1.0.16
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
