apiVersion: apps/v1
kind: Deployment
metadata:
  name: littlelink
  namespace: littlelink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: littlelink
  template:
    metadata:
      labels:
        app: littlelink
    spec:
      containers:
        - name: littlelink
          image: ghcr.io/techno-tim/littlelink-server:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: littlelink-env-configmap
          resources:
            limits:
              memory: 128Mi
              cpu: 250m
