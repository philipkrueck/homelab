apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: littlelink
  namespace: littlelink
spec:
  parentRefs:
    - name: gtw-prod
      namespace: infra-gateway
      sectionName: http
    - name: gtw-prod
      namespace: infra-gateway
      sectionName: https
  hostnames:
    - links.philipkrueck.com
    - www.links.philipkrueck.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: littlelink
          namespace: littlelink
          port: 3000
