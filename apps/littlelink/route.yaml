apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: littlelink
  namespace: littlelink
spec:
  parentRefs:
    - name: gtw-prod
      namespace: default
      sectionName: http
  hostnames:
    - links.philipkrueck.com
  rules:
    - matches:
        # TODO: needs to be links.philipkrueck.com
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: littlelink
          namespace: littlelink
          port: 3000
